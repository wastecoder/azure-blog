<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Post</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">
    <h1 class="mb-4">
        Editar Post
    </h1>

    <form id="editPostForm">
        <div class="mb-3">
            <label for="title" class="form-label">
                Título
            </label>
            <input type="text" class="form-control" id="title" required>
        </div>

        <div class="mb-3">
            <label for="content" class="form-label">
                Conteúdo
            </label>
            <textarea class="form-control" id="content" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Salvar Alterações
        </button>
        <a href="index.html" class="btn btn-secondary ms-2">
            Cancelar
        </a>
    </form>
</div>

<script>
    // Extrai o parâmetro da query string
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // Função para obter os posts do localStorage
    function getPosts() {
        const posts = localStorage.getItem('posts');
        return posts ? JSON.parse(posts) : [];
    }

    // Função para salvar os posts no localStorage
    function savePosts(posts) {
        localStorage.setItem('posts', JSON.stringify(posts));
    }

    document.addEventListener('DOMContentLoaded', () => {
        const postId = parseInt(getQueryParam('id'));
        const posts = getPosts();
        const post = posts.find(p => p.id === postId);

        if (!post) {
            alert("Post não encontrado.");
            window.location.href = "index.html";
            return;
        }

        document.getElementById('title').value = post.title;
        document.getElementById('content').value = post.content;

        document.getElementById('editPostForm').addEventListener('submit', function (e) {
            e.preventDefault();

            post.title = document.getElementById('title').value;
            post.content = document.getElementById('content').value;

            savePosts(posts);
            window.location.href = "index.html";
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
