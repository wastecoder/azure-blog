<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Detalhe do Post</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="bg-light">

        <div class="container mt-5">
            <a href="index.html" class="btn btn-secondary mb-4">
                Voltar
            </a>
            <div id="postContent" class="mb-5">
                <!-- Conteúdo do post será exibido aqui -->
            </div>

            <h3>
                Comentários
            </h3>
            <div id="comments" class="list-group mb-4">
                <!-- Comentários serão listados aqui -->
            </div>

            <form id="commentForm">
                <div class="mb-3">
                    <label for="comment" class="form-label">
                        Adicionar Comentário
                    </label>
                    <textarea class="form-control" id="comment" rows="3" required></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Enviar Comentário
                </button>
            </form>
        </div>

        <!-- Bootstrap JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <script src="../js/post-detail.js"></script>

    </body>
</html>
